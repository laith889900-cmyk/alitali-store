<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الإيطالي - فرع الشطرة</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Tahoma,sans-serif;
  background:#f7f7f9;
  color:#202536;
}

header{
  background:#72005a;
  color:white;
  position:sticky;
  top:0;
  z-index:1000;
  padding:14px 18px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.logo{
  font-size:24px;
  font-weight:bold;
}

.branch{
  font-size:14px;
  opacity:.9;
}

.actions{
  display:flex;
  gap:10px;
  align-items:center;
}

.action{
  width:52px;
  height:45px;
  border-radius:25px;
  border:0;
  background:#8d2776;
  color:white;
  font-size:18px;
}

.cart-btn{
  background:white;
  color:#72005a;
}

.hero{
  background:linear-gradient(135deg,#72005a,#a50078);
  color:white;
  text-align:center;
  padding:35px 20px;
}

.hero h1{
  font-size:42px;
  margin-bottom:8px;
}

.hero p{
  font-size:20px;
  opacity:.9;
}

.container{
  max-width:720px;
  margin:auto;
  padding:25px 18px 100px;
}

.section-title{
  text-align:center;
  font-size:32px;
  margin:15px 0 25px;
}

.categories{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-bottom:35px;
}

.category{
  border:0;
  border-radius:25px;
  padding:25px 12px;
  min-height:170px;
  font-size:20px;
  font-weight:bold;
  box-shadow:0 5px 15px #00000018;
}

.category span{
  display:block;
  font-size:48px;
  margin-bottom:10px;
}

.c1{background:#fff6c9}
.c2{background:#dff1ff}
.c3{background:#ffe4f0}
.c4{background:#ddfbe9}

.products{
  display:flex;
  flex-direction:column;
  gap:22px;
}

.product{
  background:white;
  border-radius:25px;
  overflow:hidden;
  box-shadow:0 5px 18px #00000018;
}

.product-img{
  height:230px;
  background:linear-gradient(135deg,#6b003f,#c61a8a);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:95px;
}

.product-info{
  padding:20px;
}

.tag{
  display:inline-block;
  background:#72005a;
  color:white;
  border-radius:20px;
  padding:5px 13px;
  margin-bottom:12px;
}

.product h3{
  font-size:24px;
  margin-bottom:8px;
}

.product p{
  color:#737784;
  font-size:17px;
  margin-bottom:18px;
}

.bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.price{
  color:#72005a;
  font-size:23px;
  font-weight:bold;
}

.add{
  border:0;
  background:#72005a;
  color:white;
  border-radius:25px;
  padding:12px 20px;
  font-size:17px;
  font-weight:bold;
}

.cart-count{
  position:absolute;
  top:5px;
  right:5px;
  background:#ff3150;
  color:white;
  width:20px;
  height:20px;
  border-radius:50%;
  font-size:12px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.cart-wrapper{
  position:relative;
}

.cart-panel{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:2000;
}

.cart-box{
  background:white;
  width:92%;
  max-width:500px;
  max-height:85vh;
  overflow:auto;
  margin:40px auto;
  border-radius:25px;
  padding:22px;
}

.cart-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.close{
  border:0;
  background:#eee;
  width:40px;
  height:40px;
  border-radius:50%;
  font-size:20px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #eee;
  padding:14px 0;
}

.qty{
  display:flex;
  align-items:center;
  gap:8px;
}

.qty button{
  width:30px;
  height:30px;
  border:0;
  border-radius:50%;
  background:#72005a;
  color:white;
}

.total{
  font-size:22px;
  font-weight:bold;
  margin:20px 0;
}

.whatsapp{
  width:100%;
  border:0;
  padding:16px;
  border-radius:25px;
  background:#19b95a;
  color:white;
  font-size:19px;
  font-weight:bold;
}

@media(max-width:500px){
  .hero h1{
    font-size:36px;
  }

  .section-title{
    font-size:28px;
  }

  .product-img{
    height:210px;
  }
}
</style>
</head>

<body>

<header>
  <div class="top">
    <div>
      <div class="logo">الإيطالي 🍦</div>
      <div class="branch">فرع الشطرة</div>
    </div>

    <div class="actions">
      <button class="action">EN</button>
      <button class="action">⌕</button>

      <div class="cart-wrapper">
        <button class="action cart-btn" onclick="openCart()">🛒</button>
        <span class="cart-count" id="cartCount">0</span>
      </div>
    </div>
  </div>
</header>

<section class="hero">
  <h1>الإيطالي</h1>
  <p>أفضل الحلويات والآيس كريم في العراق</p>
  <p><b>فرع الشطرة</b></p>
</section>

<main class="container">

<h2 class="section-title">جميع الأصناف</h2>

<div class="categories">
  <button class="category c1" onclick="filterProducts('حلويات')">
    <span>🍮</span>
    حلويات
  </button>

  <button class="category c2" onclick="filterProducts('آيس كريم')">
    <span>🍦</span>
    آيس كريم
  </button>

  <button class="category c3" onclick="filterProducts('كيك')">
    <span>🎂</span>
    كيك
  </button>

  <button class="category c4" onclick="filterProducts('مشروبات')">
    <span>🥤</span>
    مشروبات
  </button>
</div>

<div class="products" id="products"></div>

</main>

<div class="cart-panel" id="cartPanel">
  <div class="cart-box">

    <div class="cart-head">
      <h2>🛒 السلة</h2>
      <button class="close" onclick="closeCart()">×</button>
    </div>

    <div id="cartItems"></div>

    <div class="total">
      المجموع: <span id="total">0</span> د.ع
    </div>

    <button class="whatsapp" onclick="sendWhatsApp()">
      إرسال الطلب عبر واتساب
    </button>

  </div>
</div>

<script>

const products = [

{
 id:1,
 name:"مكس سوفت نوتيلا",
 desc:"آيس كريم سوفت مع نوتيلا",
 price:3000,
 category:"آيس كريم",
 emoji:"🍫🍦"
},

{
 id:2,
 name:"آيس كريم مشكل - ربع كيلو",
 desc:"تشكيلة نكهات آيس كريم متنوعة",
 price:3000,
 category:"آيس كريم",
 emoji:"🍨"
},

{
 id:3,
 name:"آيس كريم بالفستق - ربع كيلو",
 desc:"آيس كريم فاخر بنكهة الفستق",
 price:3500,
 category:"آيس كريم",
 emoji:"💚🍨"
},

{
 id:4,
 name:"آيس كريم مشكل - نصف كيلو",
 desc:"عبوة آيس كريم مشكلة",
 price:5000,
 category:"آيس كريم",
 emoji:"🍨🍨"
},

{
 id:5,
 name:"آيس كريم سوفت - ربع كيلو",
 desc:"آيس كريم سوفت كريمي",
 price:2500,
 category:"آيس كريم",
 emoji:"🍦"
},

{
 id:6,
 name:"كريب الإيطالي",
 desc:"كريب مميز بنكهة الإيطالي",
 price:6000,
 category:"حلويات",
 emoji:"🥞"
},

{
 id:7,
 name:"كريب نوتيلا",
 desc:"كريب بالنوتيلا",
 price:4000,
 category:"حلويات",
 emoji:"🍫🥞"
},

{
 id:8,
 name:"عصير فراولة",
 desc:"عصير فراولة طبيعي طازج",
 price:4000,
 category:"مشروبات",
 emoji:"🍓🥤"
},

{
 id:9,
 name:"عصير موز",
 desc:"عصير موز طبيعي طازج",
 price:3000,
 category:"مشروبات",
 emoji:"🍌🥤"
}

];

let cart=[];

function renderProducts(list=products){

 const box=document.getElementById("products");

 box.innerHTML=list.map(p=>`

 <div class="product">

   <div class="product-img">
     ${p.emoji}
   </div>

   <div class="product-info">

     <span class="tag">${p.category}</span>

     <h3>${p.name}</h3>

     <p>${p.desc}</p>

     <div class="bottom">

       <span class="price">
         ${p.price.toLocaleString()} د.ع
       </span>

       <button class="add" onclick="addToCart(${p.id})">
         🛒 أضف للسلة
       </button>

     </div>

   </div>

 </div>

 `).join("");
}

function addToCart(id){

 const product=products.find(p=>p.id===id);

 const item=cart.find(p=>p.id===id);

 if(item){
   item.qty++;
 }else{
   cart.push({...product,qty:1});
 }

 updateCart();
}

function updateCart(){

 document.getElementById("cartCount").textContent=
 cart.reduce((sum,p)=>sum+p.qty,0);

 const box=document.getElementById("cartItems");

 if(cart.length===0){
   box.innerHTML="<p>السلة فارغة</p>";
   document.getElementById("total").textContent="0";
   return;
 }

 box.innerHTML=cart.map(p=>`

 <div class="cart-item">

   <div>
     <b>${p.name}</b>
     <br>
     ${p.price.toLocaleString()} د.ع
   </div>

   <div class="qty">
     <button onclick="changeQty(${p.id},1)">+</button>
     <b>${p.qty}</b>
     <button onclick="changeQty(${p.id},-1)">−</button>
   </div>

 </div>

 `).join("");

 const total=cart.reduce((sum,p)=>sum+(p.price*p.qty),0);

 document.getElementById("total").textContent=
 total.toLocaleString();
}

function changeQty(id,value){

 const item=cart.find(p=>p.id===id);

 if(!item)return;

 item.qty+=value;

 if(item.qty<=0){
   cart=cart.filter(p=>p.id!==id);
 }

 updateCart();
}

function openCart(){

 document.getElementById("cartPanel").style.display="block";

 updateCart();
}

function closeCart(){

 document.getElementById("cartPanel").style.display="none";
}

function filterProducts(category){

 renderProducts(
   products.filter(p=>p.category===category)
 );

 window.scrollTo({
   top:document.getElementById("products").offsetTop-100,
   behavior:"smooth"
 });
}

function sendWhatsApp(){

 if(cart.length===0){
   alert("السلة فارغة");
   return;
 }

 let message="طلب جديد من متجر الإيطالي%0A%0A";

 cart.forEach(p=>{
   message+=
   `${p.name} × ${p.qty} = ${(p.price*p.qty).toLocaleString()} د.ع%0A`;
 });

 const total=cart.reduce(
   (sum,p)=>sum+(p.price*p.qty),0
 );

 message+=`%0Aالمجموع: ${total.toLocaleString()} د.ع`;

 const phone="9647852693335";

 window.open(
   `https://wa.me/${phone}?text=${message}`,
   "_blank"
 );
}

renderProducts();

</script>

</body>
</html>
